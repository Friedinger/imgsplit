<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImgPart | Split an image</title>
    <meta
      name="description"
      content="Split an image into two parts horizontally or vertically with a swipe and a click. Runs entirely in the browser, no server."
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>ImgPart</h1>
        <p class="app-subtitle" id="statusText">
          Paste, drop or select an image
        </p>
        <button
          type="button"
          id="resetBtn"
          class="btn btn--ghost app-header__action"
        >
          Reset
        </button>
      </header>

      <main id="dropZone" class="drop-zone">
        <div id="emptyState" class="empty-state">
          <label class="file-button">
            Choose image
            <input type="file" id="fileInput" accept="image/*" hidden />
          </label>
          <p class="empty-state__hint">
            or drop an image anywhere or paste it with
            <kbd>Ctrl</kbd>+<kbd>V</kbd>
          </p>
        </div>

        <div class="canvas-wrap" id="canvasWrap" hidden>
          <canvas id="canvas" class="canvas"></canvas>
          <div id="copyBadge" class="copy-badge" hidden>
            <span class="copy-badge__chip"></span>
          </div>
          <div id="copyHint" class="copy-hint" hidden>
            <span class="copy-hint__chip">Click to copy</span>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
